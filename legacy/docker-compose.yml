# Local production-like stack. Set secrets in .env; never commit them.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ielts
      POSTGRES_USER: ielts
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ielts -d ielts"]
      interval: 5s
      retries: 10
  migrate:
    build: .
    command: ["node", "dist/server/migrate.js"]
    environment: &appenv
      NODE_ENV: production
      DATABASE_URL: postgres://ielts:${POSTGRES_PASSWORD:-change-me}@db:5432/ielts
      APP_ORIGIN: ${APP_ORIGIN:-https://localhost}
      TRUST_PROXY: "true"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_STANDARD_PRICE_ID: ${STRIPE_STANDARD_PRICE_ID:-}
      STRIPE_PREMIUM_PRICE_ID: ${STRIPE_PREMIUM_PRICE_ID:-}
    depends_on: { db: { condition: service_healthy } }
  app:
    build: .
    environment: *appenv
    ports: ["3000:3000"]
    depends_on: { migrate: { condition: service_completed_successfully } }
volumes:
  pgdata:
